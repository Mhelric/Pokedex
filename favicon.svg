<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3c455a"/>
      <stop offset="25%" stop-color="#2a3246"/>
      <stop offset="60%" stop-color="#1b2133"/>
      <stop offset="100%" stop-color="#101524"/>
    </linearGradient>

    <!-- Device Screen Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#343c4f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#161b2b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Red Dome Gradient -->
    <linearGradient id="redDomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff475a"/>
      <stop offset="35%" stop-color="#f5223a"/>
      <stop offset="75%" stop-color="#de122a"/>
      <stop offset="100%" stop-color="#b80c20"/>
    </linearGradient>

    <!-- White Dome Gradient -->
    <linearGradient id="whiteDomeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#c5d0dc"/>
    </linearGradient>

    <!-- Lens Pupil Radial Gradient -->
    <radialGradient id="lensPupilGrad" cx="42%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#0ea5e9"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#034b75"/>
      <stop offset="100%" stop-color="#061c36"/>
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Neon Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Device Inner Screen Card Subtle Shadow/Border -->
  <rect x="172" y="152" width="678" height="742" rx="42" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Neon Frame Lines -->
  <!-- Left Outer Red Line -->
  <line x1="191" y1="170" x2="191" y2="884" stroke="#ff2d46" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Left Inner &amp; Top Blue Frame -->
  <path d="M 223 884 L 223 171 L 776 171 A 56 56 0 0 1 832 227 L 832 380" fill="none" stroke="#1ea1ff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Right Middle Red Line Segment -->
  <line x1="832" y1="402" x2="832" y2="640" stroke="#ff2d46" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Right Bottom Blue Frame Segment -->
  <path d="M 832 665 L 832 822 A 56 56 0 0 1 776 878" fill="none" stroke="#1ea1ff" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Bottom Red Line -->
  <line x1="245" y1="878" x2="760" y2="878" stroke="#ff2d46" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Three Top-Left Indicator LEDs -->
  <circle cx="264" cy="212" r="10.5" fill="#facc15" filter="url(#neonGlow)"/>
  <circle cx="303" cy="212" r="10.5" fill="#22c55e" filter="url(#neonGlow)"/>
  <circle cx="343" cy="212" r="10.5" fill="#38bdf8" filter="url(#neonGlow)"/>

  <!-- Pokeball Center Assembly: Center at (512, 528) -->
  <!-- Red Upper Dome -->
  <path d="M 218.53 498 A 295 295 0 0 1 805.47 498 L 654.9 498 A 146 146 0 0 0 369.1 498 L 218.53 498 Z" 
        fill="url(#redDomeGrad)" 
        stroke="#960b1b" 
        stroke-width="3.5" 
        stroke-linejoin="round"/>

  <!-- White Lower Dome -->
  <path d="M 218.53 558 L 369.1 558 A 146 146 0 0 0 654.9 558 L 805.47 558 A 295 295 0 0 1 218.53 558 Z" 
        fill="url(#whiteDomeGrad)" 
        stroke="#8b9cb0" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Center Outer Cyan Glowing Ring -->
  <circle cx="512" cy="528" r="100" fill="none" stroke="#00e5ff" stroke-width="14" filter="url(#cyanGlow)"/>
  <circle cx="512" cy="528" r="100" fill="none" stroke="#38bdf8" stroke-width="10"/>

  <!-- Center Dark Bezel -->
  <circle cx="512" cy="528" r="88" fill="#0f1624" stroke="#0b101b" stroke-width="2"/>

  <!-- Center Camera Lens / Sensor (Pupil) -->
  <circle cx="512" cy="528" r="68" fill="url(#lensPupilGrad)" stroke="#00e5ff" stroke-width="3.5"/>

  <!-- Soft Lower-Right Inner Reflection -->
  <circle cx="532" cy="546" r="24" fill="#38bdf8" opacity="0.25" filter="url(#cyanGlow)"/>

  <!-- Specular Gloss Highlight -->
  <circle cx="484" cy="502" r="15" fill="#ffffff" opacity="0.95"/>
  <circle cx="484" cy="502" r="9" fill="#ffffff"/>
</svg>